<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!-- Added to the Home Screen, the app opens without browser bars (iPhone has no page full screen). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="الملقّن" />
    <meta
      name="description"
      content="ملقّن نصوص احترافي في المتصفح بدعم كامل للعربية والخطوط — A professional web teleprompter with first-class Arabic and font support."
    />
    <title>Web Teleprompter · الملقّن</title>
    <script>
      // Apply language, direction and theme before first paint to avoid a flash of the wrong layout.
      (function () {
        var lang = 'en';
        var theme = 'system';
        try {
          var raw = localStorage.getItem('tp:settings');
          var ui = raw && JSON.parse(raw).state.settings.ui;
          if (!ui || (ui.lang !== 'ar' && ui.lang !== 'en')) throw 0;
          lang = ui.lang;
          if (ui.theme === 'dark' || ui.theme === 'light') theme = ui.theme;
        } catch (e) {
          var nl = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
          lang = /^ar\b/i.test(nl) ? 'ar' : 'en';
        }
        if (theme === 'system') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        root.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript · This app requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
